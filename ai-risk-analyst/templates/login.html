<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Risk Intelligence Engine - Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<style>
  body { background: #0b1326; color: #dae2fd; font-family: 'Inter', sans-serif; }
  .glass-panel { background: rgba(19, 27, 46, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
  .glass-input { background: rgba(6, 14, 32, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); color: #dae2fd; color-scheme: dark; }
  .glass-input:focus { border-color: #adc6ff; outline: none; box-shadow: 0 0 10px rgba(173, 198, 255, 0.2); }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="glass-panel rounded-xl p-8 w-full max-w-sm">
<h1 class="text-2xl font-bold text-blue-300 mb-1">Risk Engine</h1>
<p class="text-sm text-gray-400 mb-6">Sign in to continue</p>

<div id="loginError" class="hidden bg-red-500/10 border border-red-400/30 text-red-300 text-sm rounded-lg px-3 py-2 mb-4"></div>

<form id="loginForm" class="flex flex-col gap-4">
<div>
<label class="text-xs uppercase tracking-wide text-gray-400 mb-1 block">Email</label>
<input id="loginEmail" type="email" required class="glass-input w-full rounded-lg px-3 py-2 text-sm" autofocus/>
</div>
<div>
<label class="text-xs uppercase tracking-wide text-gray-400 mb-1 block">Password</label>
<input id="loginPassword" type="password" required class="glass-input w-full rounded-lg px-3 py-2 text-sm"/>
</div>
<button id="loginSubmitBtn" type="submit" class="mt-2 bg-blue-300 text-blue-950 font-bold py-2 px-4 rounded-lg hover:opacity-90 transition-all">
LOG IN
</button>
</form>

<p class="text-xs text-gray-500 mt-6">Sign in with a Firebase Authentication account (Email/Password).</p>
</div>

<!-- Firebase client SDK (for email/password sign-in only -- the actual admin work happens on the backend) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
(async () => {
  const firebaseConfig = await fetch("/config").then(r => r.json());
  firebase.initializeApp(firebaseConfig);

  const loginForm = document.getElementById("loginForm");
  const loginError = document.getElementById("loginError");
  const submitBtn = document.getElementById("loginSubmitBtn");

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    loginError.classList.add("hidden");
    submitBtn.disabled = true;
    submitBtn.textContent = "SIGNING IN...";

    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    try {
      const cred = await firebase.auth().signInWithEmailAndPassword(email, password);
      const idToken = await cred.user.getIdToken();

      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id_token: idToken }),
      });

      const data = await res.json();

      if (data.success) {
        window.location.href = "/";
      } else {
        loginError.textContent = data.error || "Sign-in failed.";
        loginError.classList.remove("hidden");
      }

    } catch (err) {
      loginError.textContent = err.message || "Sign-in failed.";
      loginError.classList.remove("hidden");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "LOG IN";
    }
  });
})();
</script>
</body>
</html>
