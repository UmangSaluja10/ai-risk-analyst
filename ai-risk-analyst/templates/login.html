<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Risk Intelligence Engine - Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<style>
  body { background: #0c1210; color: #dce7e1; font-family: 'Inter', sans-serif; }
  .glass-panel { background: rgba(18, 24, 21, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
  .glass-input { background: rgba(9, 13, 12, 0.92) !important; border: 1px solid rgba(255, 255, 255, 0.12) !important; color: #f0f5f3 !important; color-scheme: dark; }
  .glass-input::placeholder { color: rgba(240, 245, 243, 0.4) !important; }
  .glass-input:focus { border-color: #5FD6BE !important; outline: none; box-shadow: 0 0 10px rgba(95, 214, 190, 0.2); }
  .glass-input:-webkit-autofill,
  .glass-input:-webkit-autofill:hover,
  .glass-input:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 1000px rgba(9, 13, 12, 0.98) inset !important;
    -webkit-text-fill-color: #f0f5f3 !important;
    caret-color: #f0f5f3;
  }
  .tab-active { color: #5FD6BE; border-bottom: 2px solid #5FD6BE; }
  .tab-inactive { color: #869a91; border-bottom: 2px solid transparent; }
  .text-teal-accent { color: #5FD6BE; }
  .bg-teal-accent { background-color: #5FD6BE; }
  .text-teal-accent-ink { color: #003729; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="glass-panel rounded-xl p-8 w-full max-w-sm">
<h1 class="text-2xl font-bold text-teal-accent mb-1">Risk Engine</h1>

<div class="flex gap-6 mt-4 mb-6 text-sm font-bold">
<button id="tabLogin" class="tab-active pb-2 cursor-pointer">Log In</button>
<button id="tabSignup" class="tab-inactive pb-2 cursor-pointer">Sign Up</button>
</div>

<div id="authError" class="hidden bg-red-500/10 border border-red-400/30 text-red-300 text-sm rounded-lg px-3 py-2 mb-4"></div>

<!-- Log In form -->
<form id="loginForm" class="flex flex-col gap-4">
<div>
<label class="text-xs uppercase tracking-wide text-gray-400 mb-1 block">Email</label>
<input id="loginEmail" type="email" required class="glass-input w-full rounded-lg px-3 py-2 text-sm" autofocus/>
</div>
<div>
<label class="text-xs uppercase tracking-wide text-gray-400 mb-1 block">Password</label>
<input id="loginPassword" type="password" required class="glass-input w-full rounded-lg px-3 py-2 text-sm"/>
</div>
<button id="loginSubmitBtn" type="submit" class="mt-2 bg-teal-accent text-teal-accent-ink font-bold py-2 px-4 rounded-lg hover:opacity-90 transition-all">
LOG IN
</button>
</form>

<!-- Sign Up form -->
<form id="signupForm" class="hidden flex-col gap-4">
<div>
<label class="text-xs uppercase tracking-wide text-gray-400 mb-1 block">Email</label>
<input id="signupEmail" type="email" required class="glass-input w-full rounded-lg px-3 py-2 text-sm"/>
</div>
<div>
<label class="text-xs uppercase tracking-wide text-gray-400 mb-1 block">Password</label>
<input id="signupPassword" type="password" required minlength="6" class="glass-input w-full rounded-lg px-3 py-2 text-sm"/>
</div>
<div>
<label class="text-xs uppercase tracking-wide text-gray-400 mb-1 block">Confirm Password</label>
<input id="signupPasswordConfirm" type="password" required minlength="6" class="glass-input w-full rounded-lg px-3 py-2 text-sm"/>
</div>
<button id="signupSubmitBtn" type="submit" class="mt-2 bg-teal-accent text-teal-accent-ink font-bold py-2 px-4 rounded-lg hover:opacity-90 transition-all">
CREATE ACCOUNT
</button>
<p class="text-xs text-gray-500">New accounts are created with standard (Analyst) access.</p>
</form>

<p class="text-xs text-gray-500 mt-6">Powered by Firebase Authentication.</p>
</div>

<!-- Firebase client SDK (for email/password sign-in/signup only -- the actual admin work happens on the backend) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
  // Fetch Firebase config from the backend (keeps it out of the template source)
  const firebaseReady = (async () => {
    const firebaseConfig = await fetch("/config").then((r) => r.json());
    firebase.initializeApp(firebaseConfig);
  })();

  const authError = document.getElementById("authError");
  const tabLogin = document.getElementById("tabLogin");
  const tabSignup = document.getElementById("tabSignup");
  const loginForm = document.getElementById("loginForm");
  const signupForm = document.getElementById("signupForm");

  function showTab(tab) {
    authError.classList.add("hidden");
    const isLogin = tab === "login";
    loginForm.classList.toggle("hidden", !isLogin);
    loginForm.classList.toggle("flex", isLogin);
    signupForm.classList.toggle("hidden", isLogin);
    signupForm.classList.toggle("flex", !isLogin);
    tabLogin.classList.toggle("tab-active", isLogin);
    tabLogin.classList.toggle("tab-inactive", !isLogin);
    tabSignup.classList.toggle("tab-active", !isLogin);
    tabSignup.classList.toggle("tab-inactive", isLogin);
  }
  tabLogin.addEventListener("click", () => showTab("login"));
  tabSignup.addEventListener("click", () => showTab("signup"));

  async function establishSession(firebaseUser) {
    const idToken = await firebaseUser.getIdToken();
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id_token: idToken }),
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = "/";
    } else {
      throw new Error(data.error || "Sign-in failed.");
    }
  }

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    authError.classList.add("hidden");
    const btn = document.getElementById("loginSubmitBtn");
    btn.disabled = true;
    btn.textContent = "SIGNING IN...";

    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    try {
      await firebaseReady;
      const cred = await firebase.auth().signInWithEmailAndPassword(email, password);
      await establishSession(cred.user);
    } catch (err) {
      authError.textContent = err.message || "Sign-in failed. Check your email/password.";
      authError.classList.remove("hidden");
    } finally {
      btn.disabled = false;
      btn.textContent = "LOG IN";
    }
  });

  signupForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    authError.classList.add("hidden");
    const btn = document.getElementById("signupSubmitBtn");

    const email = document.getElementById("signupEmail").value;
    const password = document.getElementById("signupPassword").value;
    const confirm = document.getElementById("signupPasswordConfirm").value;

    if (password !== confirm) {
      authError.textContent = "Passwords do not match.";
      authError.classList.remove("hidden");
      return;
    }

    btn.disabled = true;
    btn.textContent = "CREATING ACCOUNT...";

    try {
      await firebaseReady;
      const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
      await establishSession(cred.user);
    } catch (err) {
      authError.textContent = err.message || "Could not create account.";
      authError.classList.remove("hidden");
    } finally {
      btn.disabled = false;
      btn.textContent = "CREATE ACCOUNT";
    }
  });
</script>
</body>
</html>
